<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보카트리 Spectrum · PIF Learning Hub로 이동했어요</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f5f5f7;color:#1d1d1f;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;word-break:keep-all}
.box{background:#fff;border-radius:24px;padding:36px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px -30px rgba(0,0,0,.3)}
.e{font-size:13px;font-weight:600;color:#6e6e73}
h1{font-size:24px;font-weight:750;letter-spacing:-.03em;line-height:1.3;margin:10px 0 12px}
p{font-size:15px;line-height:1.6;color:#424245}
a{display:inline-block;margin-top:22px;background:#0071e3;color:#fff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:99px}
small{display:block;margin-top:14px;color:#86868b;font-size:12.5px}
</style>
</head>
<body>
<div class="box">
  <div class="e">PIF Learning Hub</div>
  <h1>보카트리 Spectrum이(가)<br>PIF Hub로 이사했어요</h1>
  <p>잠시 후 새 주소로 이동합니다.<br>이 기기에 남아 있던 학습 기록도 함께 옮겨져요.</p>
  <a id="go" href="https://pif-hub.vercel.app/spectrum/">지금 이동하기</a>
  <small>새 주소 · pif-hub.vercel.app</small>
</div>
<script>
(function () {
  var T = 'https://pif-hub.vercel.app/spectrum/', P = ["vts_"];
  var data = {};
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (P.some(function (p) { return k.indexOf(p) === 0; })) data[k] = localStorage.getItem(k); } } catch (e) {}
  var url = T;
  if (Object.keys(data).length) { try { url += '#vtimport=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data))))); } catch (e) {} }
  document.getElementById('go').href = url;
  try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  try { caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
  setTimeout(function () { location.replace(url); }, 1500);
})();
</script>
</body>
</html>
